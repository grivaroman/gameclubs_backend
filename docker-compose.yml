services:
  db:
    image: postgres:16-alpine
    container_name: gameclubs_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: club
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gameclubs_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:12345678@db:5432/club
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: alpine:latest
    container_name: gameclubs_tunnel
    command: sh -c "apk add --no-cache openssh-client && ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:app:8000 serveo.net"
    depends_on:
      - app
    restart: unless-stopped
    tty: true

volumes:
  postgres_data:
