<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - CyberBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0f0f0f; display: flex; align-items: center; min-height: 100vh; color: #fff; }
        .login-card { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .form-control { background: #252525; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; }
        .form-control:focus { background: #2d2d2d; color: #fff; border-color: #00d2ff; box-shadow: none; }
        .btn-primary { background: #00d2ff; border: none; padding: 12px; font-weight: bold; border-radius: 10px; color: #000; }
        .btn-primary:hover { background: #00b8e6; box-shadow: 0 0 15px #00d2ff; }
    </style>
</head>
<body class="container">
    <div class="login-card mx-auto">
        <h2 class="text-center mb-4 fw-bold">С возвращением!</h2>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary">Email</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary">Пароль</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Войти в систему</button>
            <p class="text-center small text-secondary">Ещё не с нами? <a href="/register" class="text-info text-decoration-none">Создать аккаунт</a></p>
        </form>
    </div>
</body>
</html>
