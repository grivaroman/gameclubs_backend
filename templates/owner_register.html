<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация клуба | CyberBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0b0b0b; color: #fff; min-height: 100vh; }
        .page { max-width: 1060px; }
        .panel { background: #171717; border: 1px solid #333; border-radius: 8px; padding: 26px; }
        .form-control, .form-select { background: #252525; border: 1px solid #444; color: #fff; border-radius: 8px; padding: 12px; }
        .form-control:focus, .form-select:focus { background: #2d2d2d; color: #fff; border-color: #0dcaf0; box-shadow: none; }
        .form-control::placeholder { color: #777; }
        .game-box { background: #202020; border: 1px solid #383838; border-radius: 8px; padding: 14px; max-height: 220px; overflow-y: auto; }
        .btn-info { color: #000; font-weight: 700; }
        a { color: #0dcaf0; text-decoration: none; }
    </style>
</head>
<body>
    <main class="container page py-5">
        <div class="mb-4">
            <a href="/login">Назад ко входу</a>
            <h1 class="fw-bold mt-3 mb-2">Добавить ПК-клуб</h1>
            <p class="text-secondary mb-0">Отправь заявку владельца. CRM откроется после проверки клуба суперадмином.</p>
        </div>

        <form action="/owner/register" method="POST" class="row g-3">
            <div class="col-lg-5">
                <div class="panel h-100">
                    <h5 class="mb-3">Доступ владельца</h5>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="owner@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Телефон</label>
                        <input type="text" name="phone" class="form-control" placeholder="+7 777 000 00 00">
                    </div>
                    <div class="mb-0">
                        <label class="form-label text-secondary">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="panel">
                    <h5 class="mb-3">Карточка клуба</h5>
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label text-secondary">Название клуба</label>
                            <input type="text" name="club_name" class="form-control" placeholder="Cyber Arena" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-secondary">Город</label>
                            <input type="text" name="city" class="form-control" placeholder="Алматы">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary">Адрес</label>
                            <input type="text" name="address" class="form-control" placeholder="Улица, дом, ориентир" required>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label text-secondary">Фото клуба</label>
                            <input type="text" name="photo_url" class="form-control" placeholder="https://...">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-secondary">График</label>
                            <input type="text" name="working_hours" class="form-control" value="24/7">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary">Описание</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Зал, атмосфера, железо, особенности"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary">Что есть в клубе</label>
                            <textarea name="amenities" class="form-control" rows="3" placeholder="VIP, PS5, напитки, снеки, турниры, парковка"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary">Игры</label>
                            <div class="game-box">
                                <div class="d-flex flex-wrap gap-3">
                                    {% for game in all_games %}
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="game_ids" value="{{ game.id }}" id="owner_game_{{ game.id }}">
                                        <label class="form-check-label" for="owner_game_{{ game.id }}">{{ game.name }}</label>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-info w-100 py-3" type="submit">Отправить заявку на проверку</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
