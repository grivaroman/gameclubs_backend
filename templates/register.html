<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация игрока | CyberBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0b0b0b; color: #fff; min-height: 100vh; display: flex; align-items: center; }
        .card-auth { background: #171717; border: 1px solid #333; border-radius: 8px; padding: 34px; width: 100%; max-width: 460px; }
        .form-control { background: #252525; border: 1px solid #444; color: #fff; border-radius: 8px; padding: 12px; }
        .form-control:focus { background: #2d2d2d; color: #fff; border-color: #0dcaf0; box-shadow: none; }
        .btn-info { color: #000; font-weight: 700; }
        a { color: #0dcaf0; text-decoration: none; }
    </style>
</head>
<body>
    <main class="container">
        <div class="card-auth mx-auto">
            <h1 class="h3 fw-bold mb-2">Аккаунт игрока</h1>
            <p class="text-secondary mb-4">Бронируй места и покупай товары в клубах.</p>
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Телефон</label>
                    <input type="text" name="phone" class="form-control" placeholder="+7 777 000 00 00">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required>
                </div>
                <button type="submit" class="btn btn-info w-100 mb-3">Создать аккаунт</button>
            </form>
            <div class="d-flex justify-content-between gap-3 small">
                <a href="/login">Уже есть аккаунт</a>
                <a href="/owner/register">Я владелец клуба</a>
            </div>
        </div>
    </main>
</body>
</html>
