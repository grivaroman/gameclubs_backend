<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - CyberBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white d-flex align-items-center" style="height: 100vh;">
    <div class="container card bg-secondary p-4" style="max-width: 500px;">
        <h2 class="text-center">Создать аккаунт</h2>
        <form action="/register" method="POST">
            <div class="mb-3">
                <label>Я регистрируюсь как:</label>
                <select name="role" class="form-select">
                    <option value="user">Игрок (буду бронировать)</option>
                    <option value="admin">Администратор (владелец клуба)</option>
                </select>
            </div>
            <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
            <div class="mb-3"><input type="text" name="phone" class="form-control" placeholder="Номер телефона"></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required></div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
        <p class="mt-3 text-center small">Уже есть аккаунт? <a href="/login" class="text-info">Войти</a></p>
    </div>
</body>
</html>
