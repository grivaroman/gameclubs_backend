<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CyberBooking | Твой пропуск в игру</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .hero-section { height: 100vh; background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%); display: flex; align-items: center; justify-content: center; text-align: center; }
        .neon-text { text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; color: #00d2ff; font-weight: 800; letter-spacing: 2px; }
        .btn-neon { border: 2px solid #00d2ff; color: #00d2ff; background: transparent; padding: 12px 30px; border-radius: 50px; transition: 0.3s; font-weight: bold; }
        .btn-neon:hover { background: #00d2ff; color: #000; box-shadow: 0 0 30px #00d2ff; }
        .navbar { border-bottom: 1px solid #333; backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand neon-text" href="/">CYBER BOOKING</a>
            <div class="d-flex gap-3">
                <a href="/login" class="text-white text-decoration-none pt-2">Вход</a>
                <a href="/register" class="btn btn-neon btn-sm">Начать играть</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div>
            <h1 class="display-1 fw-bold mb-4">БРОНИРУЙ <span class="neon-text">ПОБЕДУ</span></h1>
            <p class="lead mb-5 text-secondary">Лучшие игровые клубы города в один клик. Выбирай железо, время и тащи.</p>
            <div class="d-flex justify-content-center gap-4">
                <a href="/register" class="btn btn-neon btn-lg">Зарегистрироваться</a>
                <a href="/login" class="btn btn-outline-light btn-lg px-5 rounded-5">Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
