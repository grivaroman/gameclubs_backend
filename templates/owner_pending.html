<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на проверке | CyberBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #0b0b0b; color: #fff; min-height: 100vh; display: flex; align-items: center; }
        .panel { background: #171717; border: 1px solid #333; border-radius: 8px; padding: 36px; max-width: 620px; }
        a { color: #0dcaf0; text-decoration: none; }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel mx-auto">
            <div class="badge border border-warning text-warning mb-3">На модерации</div>
            <h1 class="fw-bold mb-3">Заявка клуба отправлена</h1>
            <p class="text-secondary mb-4">
                Суперадмин проверит данные клуба. После одобрения ты получишь доступ к CRM и сможешь управлять ПК, товарами, заказами и аналитикой.
            </p>
            <div class="d-flex gap-2">
                <a href="/user/dashboard" class="btn btn-outline-info">Открыть каталог</a>
                <a href="/logout" class="btn btn-outline-danger">Выйти</a>
            </div>
        </section>
    </main>
</body>
</html>
